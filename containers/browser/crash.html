<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>页面已崩溃</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #0f1114;
    color: #e8eaed;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    cursor: default;
  }
  main { width: min(760px, 86vw); text-align: center; }
  .mark {
    width: 88px;
    height: 88px;
    margin: 0 auto 2.2rem;
    border: 2px solid #ffb4a9;
    border-radius: 50%;
    color: #ffb4a9;
    font-size: 3.2rem;
    font-weight: 300;
    line-height: 84px;
  }
  h1 {
    margin: 0 0 1.1rem;
    font-size: clamp(2rem, 5vw, 3.6rem);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  p { margin: 0.55rem 0; line-height: 1.65; }
  .lead { font-size: clamp(1rem, 1.8vw, 1.35rem); color: #c6c9ce; }
  .en { color: #8e939a; font-size: 0.95rem; }
  .hint {
    margin-top: 2.4rem;
    color: #9aa0a6;
    font-size: 0.92rem;
  }
  code {
    display: inline-block;
    margin-top: 0.45rem;
    padding: 0.35rem 0.7rem;
    border: 1px solid #34383d;
    border-radius: 6px;
    background: #171a1e;
    color: #d7dadd;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<main role="alert">
  <div class="mark" aria-hidden="true">!</div>
  <h1>页面已崩溃</h1>
  <p class="lead">浏览器窗口已被关闭，当前会话不再提供任何操作。</p>
  <p class="en">The browser window was closed. This session no longer accepts input.</p>
  <p class="hint">
    请让管理员在宿主机上重新启动会话：
    <br>
    <code>./cage down &amp;&amp; ./cage up</code>
  </p>
</main>
</body>
</html>
