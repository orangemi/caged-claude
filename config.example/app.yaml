# 优先级：启动参数 > CAGED_CLAUDE_* 环境变量 > 本文件 > 内置默认值。
# proxy.file_path 省略时读取本文件同目录的 mihomo.yaml；相对路径也以该目录为基准。
# 可选项均已注释，旁边注明默认值；需要覆盖时取消注释。
proxy:
  # file_path: mihomo.yaml  # 可选，默认 mihomo.yaml，与本应用 YAML 同目录。
  node: "Singapore"
  expected_country: SG  # 两位国家代码；null 或 any 表示不限制国家。
  # dns_upstream: https://1.1.1.1/dns-query  # 可选，默认此值；使用公网 IPv4 避免额外的 DNS 引导。

# 时区、locale、语言和 UID/GID 同时应用于 browser 与 claude 容器。
browser:
  timezone: Asia/Singapore
  # locale: en_US.UTF-8  # 可选，默认 en_US.UTF-8。
  # language: en-US  # 可选，默认 en-US；自动生成语言偏好 en-US,en。
  # puid: host  # 可选，默认 host，使用启动者的 UID；可显式指定整数，例如 1000。
  # pgid: host  # 可选，默认 host，使用启动者的主 GID；可显式指定整数，例如 1000。
  # shm_size: 1g  # 可选，默认 1g。
  # ui_scheme: http  # 可选，默认 http：从本机 http://localhost 访问网页桌面；https 使用镜像的自签名证书。

# 整个 ports 块均可省略；内部端口不发布到 Mac。
# ports:
#   ui: 3002  # 可选，默认 3002；Mac 上绑定到 127.0.0.1 的浏览器访问端口。
#   controller: 9090  # 可选，默认 9090；mihomo 控制 API，用于启动与审计检查。
#   mixed: 17890  # 可选，默认 17890；额外 HTTP/SOCKS 代理入口，当前 TUN 链路不使用。
#   debug: 9222  # 可选，默认 9222；Chromium DevTools，用于真实浏览器检查。
#   browser_probe: 19981  # 可选，默认 19981；浏览器容器只读环境探针，不发布。
#   claude_probe: 19982  # 可选，默认 19982；Claude 容器只读环境探针，不发布。

# instance: caged-claude  # 可选，默认 caged-claude。

# 可选，默认 []，不挂载 workspace；可填写一个路径或路径列表。
# 两种应用都以相同绝对路径读写挂载。
# 相对路径以本 YAML 目录为基准；CLI 可重复使用 --workspace。
# workspace: []
# workspace:
#   - /Users/yourname/Projects/your-project

# 可选。Claude 状态默认保存在 <state.dir>/<实例>/claude，容器内为 /home/claude/.claude。
# claude:
#   config_dir: ../state/caged-claude/claude/profile  # 可用该实例 claude/ 下的子目录。
#   sudo: true                      # 默认 true：claude-user 可免密码 sudo；false 时只能从宿主 ./cage shell --root。

# 可选。宿主桥：笼子里 `ssh host` 回到本机，默认开启。开启时笼子里的任何进程都能以你的身份在宿主上执行命令。
# 宿主需要 python3 和 sshd 程序（不需要开启 SSH 服务）；缺少时只警告，不影响启动。
# host_bridge:
#   enabled: true
#   user: yourname          # 默认运行 ./cage 的用户
#   sshd: /usr/sbin/sshd    # 默认自动查找
#   transport: auto         # auto：Linux/WSL 用 Unix socket，macOS 用回环 TCP；也可写 unix 或 tcp
#   port: 41234             # 仅 tcp：Mac 上监听 127.0.0.1 的端口，默认按实例名推算（41000–41999）
#   address: 0.250.250.254  # 仅 tcp：host.docker.internal 的 IPv4，默认启动时自动解析

# 可选。Claude 的 Linux 环境（/etc、/usr、/var、/opt、/srv、/root、/home/claude）和浏览器资料
# 实时保存在 <state.dir>/<实例>/，默认本项目 state/。
# state:
#   dir: ../state
#   backend: auto   # auto：macOS 用 image，Linux/WSL 用 dir；dir 需要 Linux 文件系统（如 ext4）
#   size: 64g       # 仅 image：新建镜像 disk.img 的上限，稀疏文件，按实际用量占用空间

# 整个 monitor 块可省略。单位为秒，优先级仍是 CLI > ENV > YAML > 默认。
# monitor:
#   tick: 5               # 本地配置、环境和防火墙巡检；每轮结束后等待。
#   interval: 30          # DNS 与出口复检间隔，从上次成功完成后计。
#   lease: 90             # 内核放行的有效期，只有复检通过才续期。
#   probe_timeout: 20     # 单轮探针的最大执行时间。
#   retry_initial: 15     # 断网后首次自动重检等待。
#   retry_max: 300        # 指数退避的最大等待时间。
